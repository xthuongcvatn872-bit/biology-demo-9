<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Biology Vocabulary Demo</title>

<link rel="stylesheet"
      href="style.css">

</head>


<body>

<div class="container">

<header>

<h1>Biology English Vocabulary</h1>

<p>Interactive Learning Demo</p>

</header>


<div class="counter">

<span id="currentNumber">1</span> / 9

</div>


<main>


<section class="slide-box">

<img id="slideImage"
     src="slides/001.png"
     alt="Biology vocabulary">

</section>


<section class="media-box">

<h2>🔊 Listen</h2>

<audio id="audioPlayer"
       controls
       preload="none">

<source id="audioSource"
        src="audio/001.mp3"
        type="audio/mpeg">

</audio>

</section>


<section class="media-box">

<h2>🎥 Teacher Video</h2>

<video id="videoPlayer"
       controls
       playsinline
       preload="metadata">

<source id="videoSource"
        src="video/001.mp4"
        type="video/mp4">

</video>

</section>


<div class="navigation">

<button id="previousButton">
◀ Previous
</button>

<button id="nextButton">
Next ▶
</button>

</div>


</main>


<footer>

Biology Digital Learning Material

</footer>

</div>


<script src="script.js"></script>

</body>

</html>
